name: Build Switch NRO

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build NRO
        run: make

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: hasil-homebrew-nro
          path: "*.nro"
